services:
  server:
    image: dmlink:latest
    build: .
    container_name: dmlink-server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/dmlink
      SPRING_DATASOURCE_USERNAME: dmlink_service
      SPRING_DATASOURCE_PASSWORD: dmlink_service_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    container_name: dmlink-database
    environment:
      POSTGRES_DB: dmlink
      POSTGRES_USER: dmlink_service
      POSTGRES_PASSWORD: dmlink_service_password
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmlink_service -d dmlink"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database:

